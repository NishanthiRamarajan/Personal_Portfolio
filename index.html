<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nishanthi's personal portfolio.">
    <title>Nishanthi | Personal Portfolio</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <!-- Navigation -->
    <header class="site-header" data-tone="light">
        <nav class="navbar" aria-label="Main navigation">

            <a href="#hero" class="navbar__logo">NISHANTHI</a>

            <button
                class="navbar__toggle"
                id="navToggle"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="navLinks">

                <span></span>
                <span></span>
                <span></span>

            </button>

            <div class="navbar__links" id="navLinks">
                <a href="#hero" class="navbar__link active">Home</a>
                <a href="#journey" class="navbar__link">Journey</a>
                <a href="#interests" class="navbar__link">Interests</a>
                <a href="#family" class="navbar__link">Family</a>
                <a href="#hobbies" class="navbar__link">Hobbies</a>
                <a href="#footer" class="navbar__link">Contact</a>
            </div>

        </nav>
    </header>

    <main>

<!-- ============ HERO SECTION ============ -->
    <section id="hero" class="hero" data-tone="light">

        <!-- Background image -->
        <img
            src="images/hero/HeroSectionImage.png"
            alt="Portrait photograph in a mountain and lake landscape"
            class="hero__image"
            fetchpriority="high"
        >

        <!-- Image overlay -->
        <div class="hero__overlay"></div>

        <!-- Main content -->
        <div class="hero__content">

            <p class="hero__eyebrow">HELLO, I'M</p>

            <h1 class="hero__name" id="heroName">
                <span>NIZZ</span>
            </h1>

            <p class="hero__tagline">
                Driven by curiosity.<br>
                Inspired by possibilities.
            </p>

            <a href="#journey" class="hero__button">
                Explore My Journey
                <span aria-hidden="true">→</span>
            </a>

        </div>

        <!-- Floating designations -->
        <div class="hero__person-area">

            <button
                type="button"
                class="hero__person-trigger"
                id="designationToggle"
                aria-label="Reveal my designations"
                aria-expanded="false">
            </button>

            <span class="hero__designation hero__designation--one">
                Developer
            </span>

            <span class="hero__designation hero__designation--two">
                Problem Solver
            </span>

            <span class="hero__designation hero__designation--three">
                Curious Mind
            </span>

        </div>

        <!-- Scroll indicator -->
        <a href="#journey" class="hero__scroll">
            <span>SCROLL TO EXPLORE</span>
            <span class="hero__scroll-arrow" aria-hidden="true">↓</span>
        </a>

    </section>


        <!-- Temporary section placeholders -->
        

        <section id="journey" class="placeholder">
            <h2>Journey</h2>
        </section>

        <section id="interests" class="placeholder">
            <h2>Interests</h2>
        </section>

        <section id="family" class="placeholder">
            <h2>Family</h2>
        </section>

        <section id="hobbies" class="placeholder">
            <h2>Hobbies</h2>
        </section>

    </main>

    <footer id="footer" class="placeholder">
        <h2>Contact</h2>
    </footer>

</body>
</html>
