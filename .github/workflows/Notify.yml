name: Deployment Notifications

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "### Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment failed — open an issue
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment failed for ${context.payload.workflow_run.head_sha.slice(0, 7)}`,
              body: `The GitHub Pages deployment failed.\n\nRun: ${context.payload.workflow_run.html_url}`
            });
